<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toras Dovid Zmanim</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #111827;
  color: white;
}

.screen {
  width: 100vw;
  min-height: 100vh;
  padding: 30px;
  background: linear-gradient(135deg, #111827, #1f2937);
}

.header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  min-height: 150px;
  border-bottom: 2px solid rgba(255,255,255,.2);
  margin-bottom: 25px;
}

.date-left {
  direction: ltr;
  text-align: left;
  font-size: 34px;
  font-weight: bold;
}

.heb-date {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
}

.date-right {
  text-align: right;
  font-size: 34px;
  font-weight: bold;
}

.parsha {
  font-size: 28px;
  margin-top: 10px;
  opacity: .9;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 25px;
  text-align: center;
}

.label {
  font-size: 25px;
  margin-bottom: 12px;
  opacity: .8;
}

.value {
  font-size: 34px;
  font-weight: bold;
}

.zmans {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.zman {
  background: rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 25px 15px;
  text-align: center;
}

.zman .label {
  font-size: 24px;
}

.zman .value {
  font-size: 36px;
}

.status {
  text-align: center;
  margin-top: 25px;
  font-size: 16px;
  opacity: .55;
}

@media (max-width: 900px) {
  .header {
    grid-template-columns: 1fr;
    gap: 15px;
    padding-bottom: 20px;
  }

  .date-left,
  .date-right,
  .heb-date {
    text-align: center;
  }

  .zmans {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="screen">

  <header class="header">

    <div class="date-left" id="eng">
      Loading...
    </div>

    <div class="heb-date" id="heb">
      טוען...
    </div>

    <div class="date-right">
      <div id="weekday">טוען...</div>
      <div class="parsha" id="parsha">פרשת השבוע</div>
    </div>

  </header>

  <section class="cards">

    <div class="card">
      <div class="label">דף היומי</div>
      <div id="daf" class="value">טוען...</div>
    </div>

    <div class="card">
      <div class="label">תאריך</div>
      <div id="dateSmall" class="value">טוען...</div>
    </div>

  </section>

  <section class="zmans">

    <div class="zman">
      <div class="label">סוף זמן קריאת שמע (גר״א)</div>
      <div id="shema" class="value">--:--</div>
    </div>

    <div class="zman">
      <div class="label">חצות היום</div>
      <div id="chatzot" class="value">--:--</div>
    </div>

    <div class="zman">
      <div class="label">שקיעה</div>
      <div id="sunset" class="value">--:--</div>
    </div>

    <div class="zman">
      <div class="label">צאת הכוכבים</div>
      <div id="tzeit" class="value">--:--</div>
    </div>

  </section>

  <div class="status" id="status">
    טוען נתונים...
  </div>

</div>

<script>

const API = "https://www.hebcal.com";
const ZIP = "10952";
const TZ = "America/New_York";

function dateNY() {
  const now = new Date();

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(now);
}

function time(s) {
  if (!s) return "--:--";

  return new Intl.DateTimeFormat("en-US", {
    timeZone: TZ,
    hour: "numeric",
    minute: "2-digit"
  }).format(new Date(s));
}

function english(d) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: TZ,
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  }).format(new Date(d + "T12:00:00"));
}

function hebrewDate(d) {
  return new Intl.DateTimeFormat("he-u-ca-hebrew", {
    timeZone: TZ,
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(new Date(d + "T12:00:00"));
}

function hebrewWeekday(d) {

  const weekdays = [
    "יום ראשון",
    "יום שני",
    "יום שלישי",
    "יום רביעי",
    "יום חמישי",
    "יום שישי",
    "שבת"
  ];

  const date = new Date(d + "T12:00:00");

  return weekdays[date.getDay()];
}

async function update() {

  const d = dateNY();

  try {

    const zmanUrl =
      API +
      "/zmanim?cfg=json&zip=" +
      ZIP +
      "&date=" +
      d;

    const hebcalUrl =
      API +
      "/hebcal?v=1&cfg=json&d=on&s=on&F=on&leyning=off" +
      "&start=" + d +
      "&end=" + d +
      "&zip=" + ZIP +
      "&lg=he";

    const [zmanResponse, hebcalResponse] =
      await Promise.all([
        fetch(zmanUrl),
        fetch(hebcalUrl)
      ]);

    const zmanData = await zmanResponse.json();
    const hebcalData = await hebcalResponse.json();

    document.getElementById("eng").textContent =
      english(d);

    document.getElementById("heb").textContent =
      hebrewDate(d);

    document.getElementById("weekday").textContent =
      hebrewWeekday(d);

    document.getElementById("dateSmall").textContent =
      english(d);

    if (zmanData) {

      if (zmanData.times) {

        document.getElementById("shema").textContent =
          time(zmanData.times.chatzotNight);

      }

      if (zmanData.times) {

        document.getElementById("chatzot").textContent =
          time(zmanData.times.chatzot);

        document.getElementById("sunset").textContent =
          time(zmanData.times.sunset);

        document.getElementById("tzeit").textContent =
          time(zmanData.times.tzeit708deg);
      }
    }

    const items = hebcalData.items || [];

    const parshaItem =
      items.find(x =>
        x.category === "parashat"
      );

    const dafItem =
      items.find(x =>
        x.category === "dafyomi"
      );

    if (parshaItem) {
      document.getElementById("parsha").textContent =
        parshaItem.hebrew ||
        parshaItem.title ||
        "פרשת השבוע";
    }

    if (dafItem) {
      document.getElementById("daf").textContent =
        dafItem.hebrew ||
        dafItem.title ||
        "דף היומי";
    }

    document.getElementById("status").textContent =
      "עודכן: " +
      new Intl.DateTimeFormat("he-IL", {
        timeZone: TZ,
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date());

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "שגיאה בטעינת הנתונים";

  }
}

update();

setInterval(update, 10 * 60 * 1000);

setInterval(function() {
  location.reload();
}, 6 * 60 * 60 * 1000);

</script>

</body>
</html>
